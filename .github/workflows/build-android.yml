name: Build Android APK

# Run it by hand: Actions tab -> "Build Android APK" -> "Run workflow".
# The finished app (a 64-bit .apk) is attached to a new entry under "Releases".
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.4.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK parts Godot needs
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest"

      - name: Install Godot and its export templates
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.zip
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.zip -d templates_tmp
          mv templates_tmp/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          rm -rf godot.zip templates.zip templates_tmp

      - name: Remember the app signing key between runs
        uses: actions/cache@v4
        with:
          path: ~/towerjumper.keystore
          key: towerjumper-signing-key-v1

      - name: Create the signing key (first run only)
        run: |
          if [ ! -f "$HOME/towerjumper.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/towerjumper.keystore" \
              -alias towerjumper -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass towerjumper -keypass towerjumper \
              -dname "CN=TowerJumper, O=TowerJumper fork, C=DE"
          fi

      - name: Tell Godot where Java and the Android SDK are
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOT

      - name: Give every build a higher version number
        run: sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg

      - name: Import the project
        run: godot --headless --import || true

      - name: Build the APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: towerjumper
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: towerjumper
        run: |
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/towerjumper.keystore"
          mkdir -p build
          godot --headless --export-release "Android" build/TowerJumper.apk
          ls -la build

      - name: Keep the APK as a download on this run
        uses: actions/upload-artifact@v4
        with:
          name: TowerJumper-apk
          path: build/TowerJumper.apk
          if-no-files-found: error

      - name: Publish it under Releases (easy to download on a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TowerJumper build ${{ github.run_number }}
          prerelease: true
          files: build/TowerJumper.apk
